<p>carrito works!</p>
<table class="table table-bordered">
    <thead>
        <tr>
            <th scope="col">Juegos en carrito</th>
            <th scope="col">Nombre</th>
            <th scope="col">Cantidad</th>
            <th scope="col">Agregar</th>
            <th scope="col">Eliminar</th>
            <th scope="col">Precio</th>
        </tr>
    </thead>
    <tbody>
        @for (p of juegosEnCarrito ; track p.id){
        @if(p.disponibilidad){
        <tr>
            <th scope="row">1</th>
            <td>{{ p.nombre }}</td>
            <td>cantidad</td>
            <td><button>+</button></td>
            <td><button>-</button></td>
            <td>${{ p.precio }}</td>
        </tr>

        }}

    </tbody>
    <tfoot>
        <tr>
            <th scope="row" colspan="5">Total</th>
            <th scope="col">$29.99</th>
        </tr>
    </tfoot>
</table>
