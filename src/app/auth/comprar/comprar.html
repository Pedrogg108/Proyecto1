<div class="fondo">
  <form>
    <h1 id="titulo">Metodo de Pago</h1>
    <div class="mb-3">
      <label for="numeroTarjeta" class="form-label">Número de Tarjeta</label>
      <input type="number" class="form-control" id="numeroTarjeta">
    </div>

    <div class="mb-3">
      <div>Información de facturación</div>
      <label for="nombre" class="form-label">Nombre</label>
      <input type="text" class="form-control" id="nombre">
    </div>

    <div class="mb-3">
      <label for="apellido" class="form-label">Apellido</label>
      <input type="text" class="form-control" id="apellido">
    </div>

    <div class="mb-3">
      <label for="direccionFacturacion" class="form-label">Dirección de facturación</label>
      <input type="text" class="form-control" id="direccionFacturacion">
    </div>

    <div class="mb-3">
      <label for="pais" class="form-label">País</label>
      <input type="text" class="form-control" id="pais">
    </div>

    <div class="mb-3">
      <label for="telefono" class="form-label">Teléfono</label>
      <input type="tel" class="form-control" id="telefono">
    </div>

    <button type="submit" class="btn btn-primary">Continuar</button>
  </form>
</div>
